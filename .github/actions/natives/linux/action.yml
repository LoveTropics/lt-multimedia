name: Build Natives (Linux)
inputs:
  arch:
    required: true
  target:
    required: true
  gcc_triplet:
    default: ''
    required: false

runs:
  using: composite
  steps:
    - name: Install requirements
      run: |
        apt-get update -y
        apt-get install -y nasm curl build-essential clang ca-certificates pkg-config git
      shell: bash

    - uses: actions-rust-lang/setup-rust-toolchain@v2

    - name: Setup target
      run: |
        rustup target add ${{ inputs.target }}
      shell: bash

    - name: Install cross toolchain
      if: inputs.gcc_triplet != ''
      run: |
        apt-get install -y gcc-${{ inputs.gcc_triplet }}
      shell: bash

    - uses: ./.github/actions/java-and-gradle
      with:
        java_arch: x64

    - name: Execute Gradle build
      env:
        BUILD_ARCH: ${{ inputs.arch }}
        BUILD_TARGET: ${{ inputs.target }}
        BUILD_STATIC: true
      run: ./gradlew :lib:native:build
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: natives-${{ runner.os }}-${{ matrix.arch }}
        path: lib/native/build/libs/
