name: Build & Publish

on:
  push:
    branches:
      - 'lt[0-9]+'
  workflow_dispatch:

jobs:
  windows-natives:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            msvc_arch: amd64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64

    name: Windows Natives (${{ matrix.arch }})
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/workflows/common/natives/windows
        with:
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          msvc_arch: ${{ matrix.msvc_arch }}

  linux-natives:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        include:
          - arch: x64
            target: x86_64-unknown-linux-gnu
            gcc_triplet: ''
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            gcc_triplet: aarch64-linux-gnu

    name: Linux Natives (${{ matrix.arch }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/workflows/common/natives/linux
        with:
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          gcc_triplet: ${{ matrix.gcc_triplet }}

  macos-natives:
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, arm64 ]
        include:
          - arch: x64
            target: x86_64-apple-darwin
          - arch: arm64
            target: aarch64-apple-darwin

    name: MacOS Natives (${{ matrix.arch }})
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/workflows/common/natives/macos
        with:
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}

  mod:
    name: Java Library & Mod
    runs-on: ubuntu-latest
    needs: [ windows-natives, linux-natives, macos-natives ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download natives
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: bin/

      - uses: ./.github/workflows/common/java-and-gradle
        with:
          java_arch: x64

      - name: Build mod and publish with Gradle
        env:
          CROSS_PLATFORM_BUILD: true
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew :build :publish

      - name: Locate built JARfile
        id: jar
        run: echo "jarfile=$(find build/libs/ -name "*.jar" -not -name "*slim*" -not -name "*source*")" >> $GITHUB_OUTPUT

      - name: Set Artifact name
        id: jarname
        run: echo "jarname=$(find build/libs/ -name "*.jar" -not -name "*slim*" -not -name "*source*" | sed 's:.*/::')" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jarname.outputs.jarname }}
          path: ${{ steps.jar.outputs.jarfile }}
          retention-days: 90
